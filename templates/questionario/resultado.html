{% extends "base.html" %}

{% block title %}Resultados: {{ questionario.titulo }}{% endblock %}

{% block content %}
<div class="content-header">
    <h1>Resultados: {{ questionario.titulo }}</h1>
    <a href="{{ url_for('questionario.ver_questionarios') }}" class="btn btn-secondary btn-sm">← Voltar para a lista</a>
</div>

{% for pergunta in questionario.perguntas %}
<div class="card shadow-sm mb-4">
    <div class="card-header">
        <h2 class="h5 mb-0">{{ pergunta.texto }}</h2>
    </div>
    <div class="card-body">
        <div class="chart-container" style="position: relative; height:300px; width:100%">
            <canvas id="grafico_{{ pergunta.id }}"></canvas>
        </div>
    </div>
</div>
{% endfor %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dadosGraficos = {{ dados_graficos | tojson | safe }};

    const backgroundColors = [
        'rgba(59, 130, 246, 0.7)',
        'rgba(239, 68, 68, 0.7)',
        'rgba(245, 158, 11, 0.7)',
        'rgba(16, 185, 129, 0.7)',
        'rgba(139, 92, 246, 0.7)',
        'rgba(236, 72, 153, 0.7)'
    ];
    const borderColors = [
        'rgb(59, 130, 246)',
        'rgb(239, 68, 68)',
        'rgb(245, 158, 11)',
        'rgb(16, 185, 129)',
        'rgb(139, 92, 246)',
        'rgb(236, 72, 153)'
    ];

    for (const perguntaId in dadosGraficos) {
        const ctx = document.getElementById(`grafico_${perguntaId}`).getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: dadosGraficos[perguntaId].labels,
                datasets: [{
                    label: 'Respostas',
                    data: dadosGraficos[perguntaId].dados,
                    backgroundColor: backgroundColors,
                    borderColor: borderColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: false,
                    }
                }
            }
        });
    }
});
</script>
{% endblock %}
